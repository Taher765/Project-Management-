    <div class="acount p-3">
      <div class="form-group my-3">

        <input type="text" class="form-control name" />
      </div>
      <div class="form-group my-3">
        <label for="">الايميل</label>
        <input type="text" class="form-control email" />
      </div>
      <div class="form-group my-3">
        <label for="">كلمه السر</label>
        <input
          type="text"
          class="form-control password"
          placeholder="تعديل كلمه السر"
        />
      </div>
      <div class="form-group my-3 devRole">
        <label for="">الصلاحيه</label>
        <select class="form-control role">
          <option value="admin">مدير</option>
          <option value="user">مستخدم</option>
        </select>
      </div>
      <button class="btn btn-success editAcount">تعديل</button>
      <button class="btn btn-danger deleteAcount">حذف الحساب</button>
    </div>

      <div class="form-group my-3">
        <label for="">الايميل</label>

      <div class="form-group my-3">

      <div class="form-group my-3">

      </div>
