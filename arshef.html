<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الارشيف</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />

    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/loadin.css" />
    <link rel="stylesheet" href="css/arshef.css" />
  </head>
  <body>
    <div class="loadingPage">
      <div class="book">
        <div class="inner">
          <div class="left"></div>
          <div class="middle"></div>
          <div class="right"></div>
        </div>
        <ul>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
          <li></li>
        </ul>
      </div>
    </div>
    <!-- Start Header  -->
    <header class="header shadow-sm p-3">
      <div class="container">
        <div class="navbar">
          <div>
            <h3 class="logo">ارشيف الشهور</h3>
            <h5 class="date-month"></h5>
          </div>
          <a class="btn btn-danger" href="index.html">عوده</a>
        </div>
      </div>
    </header>

    <!-- Start Filter  -->

    <div class="filter shadow-sm my-3 py-3">
      <div class="container">
        <h3>بحث عن شهر</h3>
        <div class="d-flex align-items-center gap-3">
          <div class="form-group">
            <input
              type="text"
              class="form-control input-year"
              placeholder="السنه"
            />
          </div>
          <div class="form-group">
            <input
              type="text"
              class="form-control input-month"
              placeholder="الشهر"
            />
          </div>
          <button class="btn btn-primary btn-search">عرض</button>
        </div>
      </div>
    </div>

    <div class="details">
      <div class="container">
        <h2 class="my-2">تفاصيل الشهر</h2>
        <div class="row border rounded p-2">
          <div class="box col-lg-3 col-md-6 col-sm-12">
            <div class="title-month py-3 text-center"></div>
          </div>
          <div class="box text-center col-lg-3 col-md-6 col-sm-12">
            <div class="border py-3 rounded totalDue"></div>
          </div>
          <div class="box col-lg-3 col-md-6 col-sm-12 text-center">
            <div class="border py-3 rounded totalPaid"></div>
          </div>
          <div class="box col-lg-3 col-md-6 col-sm-12 text-center">
            <div class="border py-3 rounded totalRemaining"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Start Details Table -->
    <div class="details py-4">
      <div class="container">
        <h2 clas>سجل العمال خلال الشهر</h2>
        <span class="totalWorkers badge text-bg-secondary"></span>
        <div class="table-responsive">
          <table
            class="table table-bordered table-striped table-hover text-center align-middle"
          >
            <thead class="align-middle">
              <tr class="">
                <th>اسم العمال</th>
                <th>ايام الحضور</th>
                <th>ايام الغياب</th>
                <th>اجر ايام الحضور</th>
                <th>الخصومات</th>
                <th>المكافأت</th>
                <th>الاجر المستحق</th>
                <th>المدفوع</th>
                <th>المتبقي</th>
                <th>اجراءات</th>
              </tr>
            </thead>

            <tbody class="table-body align-middle">
              <!-- in js -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <script
      type="text/javascript"
      src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
    ></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/toastify.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/arshef.js"></script>
  </body>
</html>
