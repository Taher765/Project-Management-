    />

      type="text/css"

  <body>
    <header class="py-3 bg-secondary">
      <div class="container d-flex align-items justify-content-between">
        <h3>استعاده كلمه السر</h3>
        <a href="login.html">رجوع</a>
      </div>
    </header>
    <div class="container">
      <form action="" class="form my-5">
        <label for="">ادخل ايميل مرتبط بالحساب</label>
        <div class="form-group d-flex">
          <input
            type="email"
            placeholder="ادخل الايميل المسجل لاسترجاع كلمه السر"
            class="form-control emailForgetPaasword"
          />
          <button class="sendEmail btn btn-primary">ارسال</button>
        </div>
      </form>
    </div>
    <div class="overlay">
      <div class="container">
        <div class="alert alert-warning">
          عشان ان مكسل اعمل صفحات تانيه هحط دي هنا مشي الدنيا
        </div>

        <div class="form-group">
          <label for="">ادخل رمز التحقق من الايميل</label>
          <div class="otp my-2" data-bs-otp>
            <input
              type="text"
              class="otp-input"
              maxlength="6"
              aria-label="Verification code"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="">ادخل الرقم السري الجديد</label>
          <input type="password" class="form-control newPassword" />
        </div>
        <button class="btn btn-success btnNewPassword mt-2">
          تغير كلمه المرور
        </button>
      </div>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <script src="js/toastify.js"></script>
    <!-- <script src="js/layout.js"></script> -->
    <script src="js/loading.js"></script>
    <script src="js/forget-password.js"></script>
  </body>
